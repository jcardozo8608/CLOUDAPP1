<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Aplicación Web Personalizada</title>
    <style>
        /* Estilos básicos para cambiar el diseño y colores */
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f2fe; /* Color de fondo azul claro */
            color: #1e3a8a; /* Color de texto azul oscuro */
            margin: 0;
            padding: 20px;
        }
        nav {
            background-color: #1e40af; /* Barra de menú azul oscuro */
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .contenido {
            background-color: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 8px;
        }
        table, th, td {
            border: 1px solid #1e40af;
            border-collapse: collapse;
            padding: 8px;
            width: 100%;
            margin-top: 15px;
        }
        form {
            margin-top: 20px;
        }
        input, button {
            padding: 8px;
            margin: 5px 0;
            width: 95%;
        }
        button {
            background-color: #1e40af;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. MENÚ DE NAVEGACIÓN -->
    <nav>
        <a href="#">Inicio</a>
        <a href="#informacion">Datos</a>
        <a href="#registro">Formulario</a>
    </nav>

    <div class="contenido">
        <!-- 2. NOMBRE, MENSAJE E IMAGEN -->
        <h1>Aplicación de: [Jonnathan Cardozo]</h1>
        <p>Código Estudiantil: <strong>[001]</strong></p>
        <p>¡Bienvenido a mi primera aplicación web personalizada desplegada en la nube!</p>
        
        <!-- Imagen de ejemplo sobre tecnología -->
        <img src="https://unsplash.com" alt="Computador" style="display:block; margin:auto; border-radius:4px;">

        <!-- 3. TABLA DE INFORMACIÓN -->
        <h2 id="informacion">Mis Tecnologías</h2>
        <table>
            <tr>
                <th>Herramientas</th>
                <th>Función</th>
            </tr>
            <tr>
                <td>GitHub</td>
                <td>Repositorio de código</td>
            </tr>
            <tr>
                <td>Render</td>
                <td>Servidor en la nube</td>
            </tr>
        </table>

        <!-- 4. FORMULARIO -->
        <h2 id="registro">Formulario de Contacto</h2>
        <form onsubmit="alert('¡Gracias por enviar el formulario!'); return false;">
            <label>Nombre:</label>
            <input type="text" placeholder="Escribe tu nombre" required>
            
            <label>Correo:</label>
            <input type="email" placeholder="Escribe tu correo" required>
            
            <button type="submit">Enviar Registro</button>
        </form>
    </div>

</body>
</html>
